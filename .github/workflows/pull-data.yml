name: pull-data

on:
  workflow_dispatch:
    inputs:
      modules:
        description: "pull_extensions modules"
        default: "crashes,edgar,exposure,options,sentiment"
  schedule:
    - cron: "37 21 * * 1-5"
  push:
    paths:
      - "inbox/**"
      - "tickers.txt"

permissions:
  contents: write

concurrency:
  group: pull-data
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Your main pull (prices, fundamentals, FRED, French)
        if: github.event_name != 'push'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/pull_defensive_data.py
        continue-on-error: true

      - name: Extensions (EDGAR, exposure, options, sentiment)
        if: github.event_name != 'push'
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: |
          MODS="${{ github.event.inputs.modules }}"
          if [ -z "$MODS" ]; then
            MODS="crashes,edgar,exposure,options,sentiment"
          fi
          python scripts/pull_extensions.py --tickers tickers.txt --out data --ua "$SEC_UA" --only "$MODS"

      - name: Open-access papers
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_open_papers.py --list papers.csv --out papers
        continue-on-error: true

      - name: Manifest
        run: python scripts/make_manifest.py

      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add -A data papers inbox MANIFEST.md
          git diff --cached --quiet || git commit -m "data pull $(date -u +%F)"
          git push
